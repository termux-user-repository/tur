name: Build Oh-my-peraTur

on:
workflow_dispatch:
push:
paths:
- 'packages/oh-my-pera/**'
- '.github/workflows/build.yml'

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-24.04

steps:
  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Install build dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y \
        git curl wget \
        build-essential \
        docker.io \
        jq \
        python3 \
        zip unzip

  - name: Prepare Docker
    run: |
      sudo systemctl start docker

  - name: Build package
    run: |
      chmod +x build-package.sh
      ./build-package.sh -I -a aarch64 oh-my-pera

  - name: Upload Debian package
    uses: actions/upload-artifact@v4
    with:
      name: oh-my-peraTur-aarch64
      path: debs/*.deb
      if-no-files-found: error
      retention-days: 14
