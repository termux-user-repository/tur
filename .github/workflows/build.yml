name: Build Oh-my-pera DEB

on:
workflow_dispatch:
push:
branches:
- master
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Clone Termux build system
    run: |
      git clone --depth 1 https://github.com/termux/termux-packages.git

  - name: Copy Oh-my-pera package
    run: |
      mkdir -p termux-packages/packages/oh-my-pera
      cp -a tur/oh-my-pera/. termux-packages/packages/oh-my-pera/

  - name: Load Termux Docker builder
    working-directory: termux-packages
    run: |
      ./scripts/run-docker.sh true

  - name: Build ARM64 DEB
    working-directory: termux-packages
    run: |
      ./scripts/run-docker.sh ./build-package.sh -f -I -a aarch64 oh-my-pera

  - name: Upload DEB
    uses: actions/upload-artifact@v4
    with:
      name: oh-my-pera-aarch64
      path: termux-packages/output/*.deb
      if-no-files-found: error
      retention-days: 14
