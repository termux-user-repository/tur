name: Build Oh-my-pera

'on':
  workflow_dispatch:
  push:
    paths:
      - 'tur/oh-my-pera/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Oh-my-pera only
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

          mkdir -p output

          dpkg-deb --build tur/oh-my-pera output/oh-my-pera.deb

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: oh-my-pera
          path: output/oh-my-pera.deb
