name: Build Oh-my-peraTur

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl wget python3

      - name: Prepare TUR
        run: |
          chmod +x setup-environment.sh
          ./setup-environment.sh

      - name: Build ARM64
        run: |
          ./scripts/run-docker.sh ./build-package.sh -I -a aarch64 oh-my-pera

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: oh-my-peraTur-aarch64
          path: output/**/*.deb
          if-no-files-found: error
