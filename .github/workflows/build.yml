name: Build Oh-my-peraTur

'on':
  workflow_dispatch:

jobs:
  build:
    name: Build ARM64 package
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl wget build-essential docker.io

      - name: Build package
        run: |
          chmod +x build-package.sh
          ./build-package.sh -I -a aarch64 oh-my-pera

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: oh-my-peraTur-aarch64
          path: debs/*.deb
          if-no-files-found: error
          retention-days: 14
