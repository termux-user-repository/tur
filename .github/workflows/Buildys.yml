name: Build Oh-my-pera DEB

'on':
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Termux packages
        run: git clone --depth 1 https://github.com/termux/termux-packages.git

      - name: Copy package
        run: |
          mkdir -p termux-packages/packages/oh-my-pera
          cp -r tur/oh-my-pera/. termux-packages/packages/oh-my-pera/

      - name: Build DEB
        working-directory: termux-packages
        run: ./scripts/run-docker.sh ./build-package.sh -a aarch64 oh-my-pera

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: oh-my-pera-deb
          path: termux-packages/output/*.deb
          if-no-files-found: error
